<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NIX · finanzas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { background:#0f172a; color:#f1f5f9; font-family:'Inter',system-ui,-apple-system,sans-serif; padding-bottom:80px; }
    .card { background:#1e293b; border-radius:1.5rem; padding:1.25rem; box-shadow:0 10px 25px -5px rgba(0,0,0,.6); }
    .input-slate { background:#0f172a; border:1px solid #334155; border-radius:1.2rem; padding:.9rem 1.2rem; color:white; width:100%; font-size:1rem; }
    .input-slate:focus { outline:2px solid #3b82f6; border-color:transparent; }
    .btn-primary { background:#2563eb; border-radius:3rem; padding:.9rem 1.5rem; font-weight:600; color:white; transition:all .15s; box-shadow:0 6px 14px rgba(37,99,235,.3); }
    .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
    .btn-outline { border:1.5px solid #3b82f6; border-radius:3rem; padding:.6rem 1.2rem; color:#94a3b8; background:transparent; font-weight:500; }
    .tab-bar { background:#1e293b; border-radius:3rem 3rem 0 0; position:fixed; bottom:0; left:0; right:0; max-width:420px; margin:0 auto; padding:.5rem 1rem; display:flex; justify-content:space-around; border-top:1px solid #334155; box-shadow:0 -4px 20px rgba(0,0,0,.7); z-index:50; }
    .tab-item { display:flex; flex-direction:column; align-items:center; color:#94a3b8; font-size:.7rem; padding:.4rem .8rem; border-radius:2rem; transition:.1s; }
    .tab-item.active { background:#2d3b4f; color:#60a5fa; }
    .modal-overlay { background:rgba(0,0,0,.8); backdrop-filter:blur(3px); display:none; position:fixed; inset:0; z-index:100; align-items:center; justify-content:center; padding:1rem; }
    .modal-container { background:#1e293b; border-radius:2rem; max-width:400px; width:100%; max-height:90vh; overflow-y:auto; padding:1.5rem; }
    .badge-pending    { background:#854d0e; color:#fde047; font-size:.7rem; border-radius:1rem; padding:.2rem .6rem; }
    .badge-reconciled { background:#166534; color:#bbf7d0; font-size:.7rem; border-radius:1rem; padding:.2rem .6rem; }
    .badge-cleared    { background:#1e40af; color:#bfdbfe; font-size:.7rem; border-radius:1rem; padding:.2rem .6rem; }
    .panel { display:block; } .panel.hidden { display:none; }
    .screen { display:none; position:fixed; inset:0; z-index:200; background:#0f172a; overflow-y:auto; padding:2rem 1rem; flex-direction:column; align-items:center; justify-content:center; }
    .screen.active { display:flex; }
    .toast { position:fixed; top:1rem; left:50%; transform:translateX(-50%); background:#1e293b; border:1px solid #334155; border-radius:1rem; padding:.75rem 1.25rem; font-size:.9rem; z-index:300; max-width:90vw; text-align:center; }
  </style>
</head>
<body class="max-w-md mx-auto px-4 pt-5">

<script>
  const API_URL = 'https://nix-finanzas.nixsub.workers.dev';
  const GOOGLE_CLIENT_ID = 'REEMPLAZAR_CON_CLIENT_ID';

  window.NixState = { accounts: [], categories: [], transactions: [], user: null, sessionToken: null };

  function getSession() {
    const t = localStorage.getItem('nix_session');
    const u = localStorage.getItem('nix_user');
    if (t && u) { window.NixState.sessionToken = t; window.NixState.user = JSON.parse(u); }
    return !!t;
  }
  function saveSession(token, user) {
    localStorage.setItem('nix_session', token);
    localStorage.setItem('nix_user', JSON.stringify(user));
    window.NixState.sessionToken = token;
    window.NixState.user = user;
  }
  function clearSession() {
    localStorage.removeItem('nix_session');
    localStorage.removeItem('nix_user');
    window.NixState.sessionToken = null;
    window.NixState.user = null;
  }
</script>

<!-- ══ PANTALLA LOGIN ══ -->
<div id="screen-login" class="screen active">
  <div class="text-center mb-8">
    <h1 class="text-4xl font-bold text-white">NIX<span class="text-blue-400">.fin</span></h1>
    <p class="text-slate-400 mt-2">Finanzas personales</p>
  </div>
  <div class="card w-full max-w-sm">
    <p class="text-center text-slate-300 mb-4">Entra con tu cuenta de Google</p>
    <div id="google-btn" class="flex justify-center"></div>
    <p id="login-error" class="text-red-400 text-xs text-center mt-3 hidden"></p>
  </div>
</div>

<!-- ══ PANTALLA ONBOARDING ══ -->
<div id="screen-onboarding" class="screen">
  <div class="w-full max-w-sm space-y-4">
    <div class="text-center mb-2">
      <h2 class="text-2xl font-bold text-white">Configura tus cuentas</h2>
      <p class="text-slate-400 text-sm mt-1">Agrega tus cuentas con el saldo actual</p>
    </div>
    <div id="onboarding-cuentas" class="space-y-3"></div>
    <button id="onboarding-agregar" class="btn-outline w-full flex items-center justify-center gap-2">
      <i data-lucide="plus" class="w-4 h-4"></i> Agregar cuenta
    </button>
    <button id="onboarding-listo" class="btn-primary w-full">Listo, entrar →</button>
    <p id="onboarding-error" class="text-red-400 text-xs text-center hidden"></p>
  </div>
</div>

<!-- ══ APP PRINCIPAL ══ -->
<div id="screen-app" class="screen" style="padding-bottom:0; justify-content:flex-start; padding-top:1.25rem;">

  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="flex justify-between items-start mb-4">
      <div>
        <h1 class="text-2xl font-bold text-white">NIX<span class="text-blue-400">.fin</span></h1>
        <p class="text-xs text-slate-400" id="statusConexion">cargando…</p>
      </div>
      <div class="flex items-center gap-2">
        <div class="text-right text-sm">
          <p><span class="text-slate-400">Caja:</span> <span id="saldoCaja" class="font-mono text-green-300">$—</span></p>
          <p><span class="text-slate-400">Banco:</span> <span id="saldoBBVA" class="font-mono text-blue-300">$—</span></p>
        </div>
        <button id="btnLogout" class="text-slate-500 hover:text-red-400 ml-1">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Tabs superiores -->
    <div class="flex gap-1 bg-slate-800 p-1 rounded-full mb-5 text-sm font-medium">
      <button class="tab-superior flex-1 py-2 px-1 rounded-full text-center" data-superior="dashboard">📊 Dash</button>
      <button class="tab-superior flex-1 py-2 px-1 rounded-full text-center" data-superior="transacciones">📋 Movs</button>
      <button class="tab-superior flex-1 py-2 px-1 rounded-full text-center" data-superior="importar">📎 Importar</button>
      <button class="tab-superior flex-1 py-2 px-1 rounded-full text-center" data-superior="cuentas">🏦 Cuentas</button>
    </div>

    <!-- Panel Dashboard -->
    <div id="panel-dashboard" class="panel space-y-4">
      <div class="card">
        <div class="flex justify-between items-center">
          <span class="text-slate-300">Saldo total</span>
          <span class="text-2xl font-bold text-white" id="totalSaldo">$—</span>
        </div>
        <div id="miniCuentas" class="flex gap-2 mt-3 flex-wrap"></div>
      </div>
      <div class="flex justify-center">
        <button id="abrirModalGasto" class="btn-primary flex items-center gap-2 shadow-xl text-base px-8">
          <i data-lucide="plus" class="w-5 h-5"></i> Gasto rápido
        </button>
      </div>
    </div>

    <!-- Panel Transacciones -->
    <div id="panel-transacciones" class="panel hidden space-y-3">
      <div class="card">
        <h2 class="text-lg font-medium mb-2">📋 Últimas transacciones</h2>
        <div id="listaTransacciones" class="space-y-3 max-h-[60vh] overflow-auto pr-1"></div>
      </div>
    </div>

    <!-- Panel Importar -->
    <div id="panel-importar" class="panel hidden space-y-4">
      <div class="card">
        <label class="text-sm font-medium">📎 Extracto BBVA (CSV)</label>
        <select id="importarCuenta" class="input-slate mt-2"></select>
        <textarea id="bbvaCsvInput" rows="6" class="input-slate mt-2 text-sm"
          placeholder="15/03/2025, -1250, SUPERMERCADO&#10;14/03/2025, 3400, SUELDO"></textarea>
        <button id="ejecutarParser" class="btn-primary w-full mt-3 flex items-center justify-center gap-2">
          <i data-lucide="rotate-cw" class="w-4 h-4"></i> Importar como PENDING
        </button>
        <div id="parserResult" class="text-xs text-green-400 mt-2"></div>
      </div>
    </div>

    <!-- Panel Cuentas -->
    <div id="panel-cuentas" class="panel hidden space-y-3">
      <div class="card">
        <h2 class="font-medium mb-3">Mis cuentas</h2>
        <div id="listaCuentas" class="space-y-2 text-sm"></div>
      </div>
    </div>
  </div>

  <!-- Nav inferior -->
  <nav class="tab-bar">
    <button class="tab-item active" data-bottom="dashboard"><i data-lucide="layout-dashboard" class="w-5 h-5"></i><span>Dash</span></button>
    <button class="tab-item" data-bottom="transacciones"><i data-lucide="list" class="w-5 h-5"></i><span>Movs</span></button>
    <button class="tab-item" data-bottom="importar"><i data-lucide="import" class="w-5 h-5"></i><span>Importar</span></button>
    <button class="tab-item" data-bottom="cuentas"><i data-lucide="wallet" class="w-5 h-5"></i><span>Cuentas</span></button>
  </nav>

</div><!-- /screen-app -->

<!-- ══ MODAL GASTO RÁPIDO ══ -->
<div id="modalGasto" class="modal-overlay">
  <div class="modal-container">
    <h2 class="text-xl font-bold flex justify-between items-center">
      <span>➕ Gasto rápido</span>
      <button id="cerrarModal" class="text-slate-400"><i data-lucide="x" class="w-6"></i></button>
    </h2>
    <div class="space-y-3 mt-3">
      <input type="number" id="montoGasto" placeholder="Monto (negativo = gasto)" class="input-slate" step="0.01">
      <select id="cuentaGasto" class="input-slate"></select>
      <select id="categoriaGasto" class="input-slate"><option value="">Sin categoría</option></select>
      <input type="text" id="notaGasto" placeholder="Nota (opcional)" class="input-slate">
      <div class="flex gap-2 flex-wrap">
        <button id="capturarUbicacion" class="btn-outline flex items-center gap-1 text-sm">
          <i data-lucide="map-pin" class="w-4"></i> Ubicación
        </button>
        <label class="btn-outline flex items-center gap-1 text-sm cursor-pointer">
          <i data-lucide="camera" class="w-4"></i> Adjuntar
          <input type="file" id="archivoGasto" accept="image/*,audio/*" class="hidden">
        </label>
      </div>
      <div id="ubicacionStatus" class="text-xs text-slate-400">📍 Sin ubicación</div>
      <div id="fileStatus" class="text-xs text-slate-400"></div>
      <button id="guardarGastoBtn" class="btn-primary w-full flex items-center justify-center gap-2">
        <i data-lucide="check" class="w-4 h-4"></i> <span id="guardarBtnText">Guardar</span>
      </button>
      <p id="errorGasto" class="text-xs text-red-400 hidden"></p>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
(function () {
  lucide.createIcons();

  function fmt(n) {
    if (n == null) return '—';
    return '$' + parseFloat(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function showToast(msg, color = 'text-green-400') {
    const el = document.getElementById('toast');
    el.className = `toast ${color}`;
    el.textContent = msg;
    el.classList.remove('hidden');
    el.style.opacity = '1';
    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.classList.add('hidden'), 300); }, 3000);
  }
  async function apiFetch(path, opts = {}) {
    opts.headers = opts.headers || {};
    if (window.NixState.sessionToken) opts.headers['Authorization'] = `Bearer ${window.NixState.sessionToken}`;
    const res  = await fetch(API_URL + path, opts);
    const data = await res.json();
    if (res.status === 401) { doLogout(); throw new Error('Sesión expirada'); }
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  // ── Pantallas ─────────────────────────────────────────
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + id).classList.add('active');
    lucide.createIcons();
  }

  // ── Google Login ──────────────────────────────────────
  window.handleGoogleCredential = async function(response) {
    try {
      const res  = await fetch(API_URL + '/api/auth/google', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken: response.credential }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error);
      saveSession(data.sessionToken, data.user);
      if (data.needsOnboarding) { showScreen('onboarding'); renderOnboarding(); }
      else { await loadApp(); showScreen('app'); }
    } catch (err) {
      const el = document.getElementById('login-error');
      el.textContent = err.message; el.classList.remove('hidden');
    }
  };

  function initGoogleLogin() {
    if (!window.google) { setTimeout(initGoogleLogin, 300); return; }
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential });
    google.accounts.id.renderButton(document.getElementById('google-btn'), {
      theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with',
    });
  }

  // ── Onboarding ────────────────────────────────────────
  let onboardingCuentas = [{ name: '', type: 'CASH', initial_balance: 0 }];

  function renderOnboarding() {
    const container = document.getElementById('onboarding-cuentas');
    container.innerHTML = onboardingCuentas.map((c, i) => `
      <div class="card space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-sm font-medium text-slate-300">Cuenta ${i + 1}</span>
          ${i > 0 ? `<button onclick="removeOnboardingCuenta(${i})" class="text-slate-500 hover:text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
        </div>
        <input type="text" placeholder="Nombre (ej: BBVA, Efectivo)" class="input-slate"
          value="${c.name}" oninput="onboardingCuentas[${i}].name = this.value">
        <select class="input-slate" onchange="onboardingCuentas[${i}].type = this.value">
          <option value="CASH"        ${c.type==='CASH'?'selected':''}>💵 Efectivo / Caja</option>
          <option value="BANK"        ${c.type==='BANK'?'selected':''}>🏦 Cuenta banco</option>
          <option value="CREDIT_CARD" ${c.type==='CREDIT_CARD'?'selected':''}>💳 Tarjeta de crédito</option>
        </select>
        <input type="number" placeholder="Saldo actual" class="input-slate" step="0.01"
          value="${c.initial_balance || ''}" oninput="onboardingCuentas[${i}].initial_balance = parseFloat(this.value) || 0">
      </div>`).join('');
    lucide.createIcons();
  }

  window.removeOnboardingCuenta = function(i) {
    onboardingCuentas.splice(i, 1); renderOnboarding();
  };

  document.getElementById('onboarding-agregar').addEventListener('click', () => {
    onboardingCuentas.push({ name: '', type: 'CASH', initial_balance: 0 }); renderOnboarding();
  });

  document.getElementById('onboarding-listo').addEventListener('click', async () => {
    const errEl   = document.getElementById('onboarding-error');
    const btn     = document.getElementById('onboarding-listo');
    const validas = onboardingCuentas.filter(c => c.name.trim());
    if (!validas.length) { errEl.textContent = 'Agrega al menos una cuenta'; errEl.classList.remove('hidden'); return; }
    errEl.classList.add('hidden');
    btn.disabled = true;
    try {
      for (const c of validas) {
        await apiFetch('/api/accounts', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: c.name.trim(), type: c.type, initial_balance: c.initial_balance }),
        });
      }
      await loadApp();
      showScreen('app');
    } catch (err) {
      errEl.textContent = err.message; errEl.classList.remove('hidden');
    } finally { btn.disabled = false; }
  });

  // ── App ───────────────────────────────────────────────
  async function loadApp() {
    const [accRes, catRes, txRes] = await Promise.all([
      apiFetch('/api/accounts'),
      apiFetch('/api/categories'),
      apiFetch('/api/transactions?limit=50'),
    ]);
    window.NixState.accounts     = accRes?.accounts     || [];
    window.NixState.categories   = catRes?.categories   || [];
    window.NixState.transactions = txRes?.transactions  || [];
    document.getElementById('statusConexion').textContent = 'D1 conectado ✓';
    populateSelects(); refreshSaldos(); renderTransacciones(); renderCuentas();
  }

  function populateSelects() {
    const accounts = window.NixState.accounts;
    ['cuentaGasto', 'importarCuenta'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
    });
    document.getElementById('categoriaGasto').innerHTML =
      '<option value="">Sin categoría</option>' +
      window.NixState.categories.map(c => `<option value="${c.id}">${c.icon || ''} ${c.name}</option>`).join('');
  }

  function refreshSaldos() {
    const accounts = window.NixState.accounts;
    const totalCash = accounts.filter(a => a.type === 'CASH').reduce((s, a) => s + parseFloat(a.current_balance || 0), 0);
    const totalBank = accounts.filter(a => a.type !== 'CASH').reduce((s, a) => s + parseFloat(a.current_balance || 0), 0);
    document.getElementById('saldoCaja').textContent = fmt(totalCash);
    document.getElementById('saldoBBVA').textContent = fmt(totalBank);
    document.getElementById('totalSaldo').textContent = fmt(accounts.reduce((s, a) => s + parseFloat(a.current_balance || 0), 0));
    document.getElementById('miniCuentas').innerHTML = accounts.map(a => `
      <div class="flex-1 bg-slate-900 p-2 rounded-xl text-center min-w-0">
        <span class="text-xs text-slate-400 truncate block">${a.name}</span>
        <span class="block font-semibold text-sm">${fmt(a.current_balance)}</span>
      </div>`).join('');
  }

  function renderTransacciones() {
    const container = document.getElementById('listaTransacciones');
    const txs = window.NixState.transactions;
    if (!txs.length) { container.innerHTML = '<p class="text-slate-500 text-sm text-center py-4">Sin transacciones</p>'; return; }
    container.innerHTML = txs.map(tx => {
      const badgeCls = tx.status === 'RECONCILED' ? 'badge-reconciled' : tx.status === 'CLEARED' ? 'badge-cleared' : 'badge-pending';
      const amtColor = parseFloat(tx.amount) < 0 ? 'text-red-300' : 'text-green-300';
      return `<div class="bg-slate-900 p-3 rounded-xl text-sm flex justify-between items-center">
        <div>
          <span class="font-mono ${amtColor}">${fmt(tx.amount)}</span>
          <span class="text-slate-400 ml-1">${tx.account_name || ''}</span>
          <div class="text-xs text-slate-500">${tx.category_icon || ''} ${tx.category_name || '—'} · ${(tx.transaction_date || '').slice(0,10)}</div>
          ${tx.description ? `<div class="text-xs text-slate-400 italic">${tx.description}</div>` : ''}
        </div>
        <span class="${badgeCls}">${tx.status}</span>
      </div>`;
    }).join('');
  }

  function renderCuentas() {
    document.getElementById('listaCuentas').innerHTML = window.NixState.accounts.map(a => `
      <div class="flex justify-between items-center bg-slate-900 p-2 rounded-xl">
        <span>${a.type === 'CASH' ? '💵' : a.type === 'CREDIT_CARD' ? '💳' : '🏦'} ${a.name}</span>
        <span class="font-mono">${fmt(a.current_balance)} ${a.currency || ''}</span>
      </div>`).join('');
  }

  // ── Navegación ────────────────────────────────────────
  const panels = {
    dashboard: document.getElementById('panel-dashboard'),
    transacciones: document.getElementById('panel-transacciones'),
    importar: document.getElementById('panel-importar'),
    cuentas: document.getElementById('panel-cuentas'),
  };

  function showPanel(id) {
    Object.values(panels).forEach(p => p.classList.add('hidden'));
    panels[id].classList.remove('hidden');
    document.querySelectorAll('.tab-item').forEach(t => t.classList.toggle('active', t.dataset.bottom === id));
    document.querySelectorAll('.tab-superior').forEach(t => {
      t.classList.toggle('bg-blue-600', t.dataset.superior === id);
      t.classList.toggle('text-white', t.dataset.superior === id);
    });
  }
  document.querySelectorAll('.tab-item').forEach(t => t.addEventListener('click', () => showPanel(t.dataset.bottom)));
  document.querySelectorAll('.tab-superior').forEach(t => t.addEventListener('click', () => showPanel(t.dataset.superior)));

  // ── Logout ────────────────────────────────────────────
  function doLogout() { clearSession(); showScreen('login'); initGoogleLogin(); }
  document.getElementById('btnLogout').addEventListener('click', doLogout);

  // ── Modal gasto ───────────────────────────────────────
  const modal = document.getElementById('modalGasto');
  document.getElementById('abrirModalGasto').addEventListener('click', () => modal.style.display = 'flex');
  document.getElementById('cerrarModal').addEventListener('click', cerrarModal);
  window.addEventListener('click', e => { if (e.target === modal) cerrarModal(); });

  function cerrarModal() {
    modal.style.display = 'none';
    latCapturado = null; lngCapturado = null;
    document.getElementById('ubicacionStatus').textContent = '📍 Sin ubicación';
    document.getElementById('fileStatus').textContent = '';
    document.getElementById('errorGasto').classList.add('hidden');
    document.getElementById('archivoGasto').value = '';
    document.getElementById('montoGasto').value = '';
    document.getElementById('notaGasto').value = '';
  }

  let latCapturado = null, lngCapturado = null;
  document.getElementById('capturarUbicacion').addEventListener('click', () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      pos => { latCapturado = pos.coords.latitude; lngCapturado = pos.coords.longitude; document.getElementById('ubicacionStatus').textContent = `📍 ${latCapturado.toFixed(4)}, ${lngCapturado.toFixed(4)}`; },
      () => { document.getElementById('ubicacionStatus').textContent = '❌ Error'; }
    );
  });

  document.getElementById('archivoGasto').addEventListener('change', e => {
    document.getElementById('fileStatus').textContent = e.target.files[0] ? `📎 ${e.target.files[0].name}` : '';
  });

  document.getElementById('guardarGastoBtn').addEventListener('click', async () => {
    const btn = document.getElementById('guardarGastoBtn');
    const btnText = document.getElementById('guardarBtnText');
    const errEl = document.getElementById('errorGasto');
    const monto = parseFloat(document.getElementById('montoGasto').value);
    const account_id  = document.getElementById('cuentaGasto').value;
    const category_id = document.getElementById('categoriaGasto').value;
    const nota = document.getElementById('notaGasto').value.trim();
    const fileInput = document.getElementById('archivoGasto');

    if (!account_id)  { errEl.textContent = 'Selecciona una cuenta'; errEl.classList.remove('hidden'); return; }
    if (isNaN(monto)) { errEl.textContent = 'Ingresa un monto válido'; errEl.classList.remove('hidden'); return; }
    errEl.classList.add('hidden');

    const fd = new FormData();
    fd.append('account_id', account_id);
    fd.append('category_id', category_id);
    fd.append('amount', monto);
    if (latCapturado != null) fd.append('lat', latCapturado);
    if (lngCapturado != null) fd.append('lng', lngCapturado);
    if (nota) fd.append('nota', nota);
    if (fileInput.files[0]) fd.append('file', fileInput.files[0]);

    btn.disabled = true; btnText.textContent = 'Guardando…';
    try {
      const res = await apiFetch('/api/transactions', { method: 'POST', body: fd });
      window.NixState.transactions.unshift(res.transaction);
      const acc = window.NixState.accounts.find(a => a.id === account_id);
      if (acc) acc.current_balance = parseFloat(acc.current_balance || 0) + monto;
      refreshSaldos(); renderTransacciones(); renderCuentas();
      cerrarModal(); showToast('✅ Transacción guardada');
    } catch (err) {
      errEl.textContent = err.message; errEl.classList.remove('hidden');
    } finally { btn.disabled = false; btnText.textContent = 'Guardar'; }
  });

  // ── Importar BBVA ─────────────────────────────────────
  document.getElementById('ejecutarParser').addEventListener('click', async () => {
    const csvText    = document.getElementById('bbvaCsvInput').value.trim();
    const account_id = document.getElementById('importarCuenta').value;
    const resultEl   = document.getElementById('parserResult');
    const btn        = document.getElementById('ejecutarParser');
    if (!csvText) { resultEl.textContent = '⚠️ Pega el texto del extracto'; return; }
    btn.disabled = true; resultEl.textContent = 'Importando…';
    try {
      const res = await apiFetch('/api/import/bbva', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ csvText, account_id }),
      });
      resultEl.textContent = `✅ ${res.imported} transacciones importadas`;
      const txRes = await apiFetch('/api/transactions?limit=50');
      window.NixState.transactions = txRes?.transactions || [];
      renderTransacciones();
    } catch (err) {
      resultEl.textContent = '❌ ' + err.message;
    } finally { btn.disabled = false; }
  });

  // ── Arrancar ──────────────────────────────────────────
  if (getSession()) {
    loadApp().then(() => showScreen('app')).catch(() => { clearSession(); showScreen('login'); initGoogleLogin(); });
  } else {
    showScreen('login');
    initGoogleLogin();
  }

})();
</script>
</body>
</html>
