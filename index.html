<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NIX · finanzas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background:#0f172a; color:#f1f5f9; font-family:'Inter',system-ui,-apple-system,sans-serif; padding-bottom:80px; }
    .card { background:#1e293b; border-radius:1.5rem; padding:1.25rem; box-shadow:0 10px 25px -5px rgba(0,0,0,.6); }
    .input-slate { background:#0f172a; border:1px solid #334155; border-radius:1.2rem; padding:.9rem 1.2rem; color:white; width:100%; font-size:1rem; }
    .input-slate:focus { outline:2px solid #3b82f6; border-color:transparent; }
    .btn-primary { background:#2563eb; border-radius:3rem; padding:.9rem 1.5rem; font-weight:600; color:white; transition:all .15s; box-shadow:0 6px 14px rgba(37,99,235,.3); }
    .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
    .btn-outline { border:1.5px solid #3b82f6; border-radius:3rem; padding:.6rem 1.2rem; color:#94a3b8; background:transparent; font-weight:500; }
    .tab-bar { background:#1e293b; border-radius:3rem 3rem 0 0; position:fixed; bottom:0; left:0; right:0; max-width:420px; margin:0 auto; padding:.5rem 1rem; display:flex; justify-content:space-around; border-top:1px solid #334155; box-shadow:0 -4px 20px rgba(0,0,0,.7); z-index:50; }
    .tab-item { display:flex; flex-direction:column; align-items:center; color:#94a3b8; font-size:.7rem; padding:.4rem .8rem; border-radius:2rem; transition:.1s; }
    .tab-item.active { background:#2d3b4f; color:#60a5fa; }
    .tab-item i { margin-bottom:.1rem; }
    .modal-overlay { background:rgba(0,0,0,.8); backdrop-filter:blur(3px); display:none; position:fixed; inset:0; z-index:100; align-items:center; justify-content:center; padding:1rem; }
    .modal-container { background:#1e293b; border-radius:2rem; max-width:400px; width:100%; max-height:90vh; overflow-y:auto; padding:1.5rem; }
    .badge-pending { background:#854d0e; color:#fde047; font-size:.7rem; border-radius:1rem; padding:.2rem .6rem; }
    .badge-reconciled { background:#166534; color:#bbf7d0; font-size:.7rem; border-radius:1rem; padding:.2rem .6rem; }
    .badge-cleared { background:#1e40af; color:#bfdbfe; font-size:.7rem; border-radius:1rem; padding:.2rem .6rem; }
    .panel { display:block; }
    .panel.hidden { display:none; }
    .tab-item.active i, .tab-item.active span { color:#60a5fa; }
    .toast { position:fixed; top:1rem; left:50%; transform:translateX(-50%); background:#1e293b; border:1px solid #334155; border-radius:1rem; padding:.75rem 1.25rem; font-size:.9rem; z-index:200; transition:opacity .3s; max-width:90vw; text-align:center; }
  </style>
</head>
<body class="max-w-md mx-auto px-4 pt-5">

<script>
  // ══════════════════════════════════════════════════════
  // CONFIGURACIÓN — actualiza estas dos constantes
  // Desarrollo local:  https://nix-finanzas.nixsub.workers.dev
  // Producción:        https://nix-finanzas.TU-SUBDOMINIO.workers.dev
  // ══════════════════════════════════════════════════════
  const API_URL   = 'https://nix-finanzas.nixsub.workers.dev';
  const API_TOKEN = '8ef196722da038cd9324fed268ad6277050070141d3dc25eb9a2c5934053f77b'; // debe coincidir con el secret del worker

  // Estado en memoria (se hidrata desde la API al cargar)
  window.NixState = {
    accounts: [],
    categories: [],
    transactions: [],
  };
</script>

<!-- HEADER -->
<div class="flex justify-between items-start mb-4">
  <div>
    <h1 class="text-2xl font-bold text-white">NIX<span class="text-blue-400">.fin</span></h1>
    <p class="text-xs text-slate-400" id="statusConexion">conectando…</p>
  </div>
  <div class="text-right text-sm">
    <p><span class="text-slate-400">Caja:</span> <span id="saldoCaja" class="font-mono text-green-300">$—</span></p>
    <p><span class="text-slate-400">BBVA:</span> <span id="saldoBBVA" class="font-mono text-blue-300">$—</span></p>
  </div>
</div>

<!-- TABS SUPERIORES -->
<div class="flex gap-1 bg-slate-800 p-1 rounded-full mb-5 text-sm font-medium">
  <button class="tab-superior flex-1 py-2 px-1 rounded-full text-center" data-superior="dashboard">📊 Dash</button>
  <button class="tab-superior flex-1 py-2 px-1 rounded-full text-center" data-superior="transacciones">📋 Movs</button>
  <button class="tab-superior flex-1 py-2 px-1 rounded-full text-center" data-superior="importar">📎 Importar</button>
  <button class="tab-superior flex-1 py-2 px-1 rounded-full text-center" data-superior="cuentas">🏦 Cuentas</button>
</div>

<!-- PANEL DASHBOARD -->
<div id="panel-dashboard" class="panel space-y-4">
  <div class="card">
    <div class="flex justify-between items-center">
      <span class="text-slate-300">Saldo total</span>
      <span class="text-2xl font-bold text-white" id="totalSaldo">$—</span>
    </div>
    <div class="flex gap-2 mt-3">
      <div class="flex-1 bg-slate-900 p-2 rounded-xl text-center">
        <span class="text-xs text-slate-400">Caja</span>
        <span class="block font-semibold" id="cajaPequeno">—</span>
      </div>
      <div class="flex-1 bg-slate-900 p-2 rounded-xl text-center">
        <span class="text-xs text-slate-400">BBVA</span>
        <span class="block font-semibold" id="bbvaPequeno">—</span>
      </div>
    </div>
  </div>
  <div class="flex justify-center">
    <button id="abrirModalGasto" class="btn-primary flex items-center gap-2 shadow-xl text-base px-8">
      <i data-lucide="plus" class="w-5 h-5"></i> Gasto rápido
    </button>
  </div>
</div>

<!-- PANEL TRANSACCIONES -->
<div id="panel-transacciones" class="panel hidden space-y-3">
  <div class="card">
    <h2 class="text-lg font-medium mb-2">📋 Últimas transacciones</h2>
    <div id="listaTransacciones" class="space-y-3 max-h-[60vh] overflow-auto pr-1"></div>
  </div>
</div>

<!-- PANEL IMPORTAR BBVA -->
<div id="panel-importar" class="panel hidden space-y-4">
  <div class="card">
    <label class="text-sm font-medium flex gap-1">
      <i data-lucide="file-text" class="w-4"></i> Pegar extracto BBVA (CSV)
    </label>
    <textarea id="bbvaCsvInput" rows="7" class="input-slate mt-2 text-sm"
      placeholder="15/03/2025, -1250, SUPERMERCADO&#10;14/03/2025, 3400, SUELDO"></textarea>
    <button id="ejecutarParser" class="btn-primary w-full mt-3 flex items-center justify-center gap-2">
      <i data-lucide="rotate-cw" class="w-4 h-4"></i> Importar como PENDING
    </button>
    <div id="parserResult" class="text-xs text-green-400 mt-2"></div>
  </div>
</div>

<!-- PANEL CUENTAS -->
<div id="panel-cuentas" class="panel hidden space-y-3">
  <div class="card">
    <h2 class="font-medium mb-3">Cuentas (D1)</h2>
    <div id="listaCuentas" class="space-y-2 text-sm"></div>
  </div>
</div>

<!-- NAV INFERIOR -->
<nav class="tab-bar">
  <button class="tab-item active" data-bottom="dashboard"><i data-lucide="layout-dashboard" class="w-5 h-5"></i><span>Dash</span></button>
  <button class="tab-item" data-bottom="transacciones"><i data-lucide="list" class="w-5 h-5"></i><span>Movs</span></button>
  <button class="tab-item" data-bottom="importar"><i data-lucide="import" class="w-5 h-5"></i><span>Importar</span></button>
  <button class="tab-item" data-bottom="cuentas"><i data-lucide="wallet" class="w-5 h-5"></i><span>Cuentas</span></button>
</nav>

<!-- MODAL GASTO RÁPIDO -->
<div id="modalGasto" class="modal-overlay">
  <div class="modal-container">
    <h2 class="text-xl font-bold flex justify-between items-center">
      <span>➕ Gasto rápido</span>
      <button id="cerrarModal" class="text-slate-400"><i data-lucide="x" class="w-6"></i></button>
    </h2>
    <div class="space-y-3 mt-3">
      <input type="number" id="montoGasto" placeholder="Monto (negativo = gasto)" class="input-slate" step="0.01">

      <select id="cuentaGasto" class="input-slate">
        <option value="">Cargando cuentas…</option>
      </select>

      <select id="categoriaGasto" class="input-slate">
        <option value="">Sin categoría</option>
      </select>

      <input type="text" id="notaGasto" placeholder="Nota (opcional)" class="input-slate">

      <div class="flex gap-2 flex-wrap">
        <button id="capturarUbicacion" class="btn-outline flex items-center gap-1 text-sm">
          <i data-lucide="map-pin" class="w-4"></i> Ubicación
        </button>
        <label class="btn-outline flex items-center gap-1 text-sm cursor-pointer">
          <i data-lucide="camera" class="w-4"></i> Adjuntar
          <input type="file" id="archivoGasto" accept="image/*,audio/*" class="hidden">
        </label>
      </div>
      <div id="ubicacionStatus" class="text-xs text-slate-400">📍 Sin ubicación</div>
      <div id="fileStatus" class="text-xs text-slate-400"></div>

      <button id="guardarGastoBtn" class="btn-primary w-full flex items-center justify-center gap-2">
        <i data-lucide="check" class="w-4 h-4"></i> <span id="guardarBtnText">Guardar</span>
      </button>
      <p id="errorGasto" class="text-xs text-red-400 hidden"></p>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>

<script>
(function () {
  lucide.createIcons();

  // ── Helpers ─────────────────────────────────────────
  function fmt(n) {
    if (n == null) return '—';
    return '$' + parseFloat(n).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function showToast(msg, color = 'text-green-400') {
    const el = document.getElementById('toast');
    el.className = `toast ${color}`;
    el.textContent = msg;
    el.classList.remove('hidden');
    el.style.opacity = '1';
    setTimeout(() => {
      el.style.opacity = '0';
      setTimeout(() => el.classList.add('hidden'), 300);
    }, 3000);
  }

  async function apiFetch(path, opts = {}) {
    opts.headers = opts.headers || {};
    opts.headers['Authorization'] = `Bearer ${API_TOKEN}`;
    const res = await fetch(API_URL + path, opts);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  // ── Navegación ─────────────────────────────────────
  const panels = {
    dashboard:      document.getElementById('panel-dashboard'),
    transacciones:  document.getElementById('panel-transacciones'),
    importar:       document.getElementById('panel-importar'),
    cuentas:        document.getElementById('panel-cuentas'),
  };
  const tabsBottom = document.querySelectorAll('.tab-item');
  const tabsSuper  = document.querySelectorAll('.tab-superior');

  function showPanel(id) {
    Object.values(panels).forEach(p => p.classList.add('hidden'));
    panels[id].classList.remove('hidden');
    tabsBottom.forEach(t => t.classList.toggle('active', t.dataset.bottom === id));
    tabsSuper.forEach(t => t.classList.toggle('bg-blue-600', t.dataset.superior === id));
    tabsSuper.forEach(t => t.classList.toggle('text-white', t.dataset.superior === id));
  }

  tabsBottom.forEach(t => t.addEventListener('click', () => showPanel(t.dataset.bottom)));
  tabsSuper.forEach(t  => t.addEventListener('click',  () => showPanel(t.dataset.superior)));

  // ── Render UI ───────────────────────────────────────
  function refreshSaldos() {
    const state = window.NixState;
    const saldoPorCuenta = (id) =>
      state.transactions
        .filter(t => t.account_id === id && t.status !== 'PENDING')
        .reduce((acc, t) => acc + parseFloat(t.amount || 0), 0);

    // Para saldo mostrado usamos current_balance de la cuenta si existe
    const caja = state.accounts.find(a => a.id === 'acc_cash');
    const bbva = state.accounts.find(a => a.id === 'acc_bbva');
    const saldoCaja = caja ? parseFloat(caja.current_balance || 0) : 0;
    const saldoBBVA = bbva ? parseFloat(bbva.current_balance || 0) : 0;

    document.getElementById('saldoCaja').textContent  = fmt(saldoCaja);
    document.getElementById('saldoBBVA').textContent  = fmt(saldoBBVA);
    document.getElementById('cajaPequeno').textContent = fmt(saldoCaja);
    document.getElementById('bbvaPequeno').textContent = fmt(saldoBBVA);
    document.getElementById('totalSaldo').textContent  = fmt(saldoCaja + saldoBBVA);
  }

  function renderTransacciones() {
    const container = document.getElementById('listaTransacciones');
    const txs = window.NixState.transactions;
    if (!txs.length) {
      container.innerHTML = '<p class="text-slate-500 text-sm text-center py-4">Sin transacciones</p>';
      return;
    }
    container.innerHTML = txs.map(tx => {
      const badgeCls = tx.status === 'RECONCILED'
        ? 'badge-reconciled'
        : tx.status === 'CLEARED' ? 'badge-cleared' : 'badge-pending';
      const amtColor = parseFloat(tx.amount) < 0 ? 'text-red-300' : 'text-green-300';
      const fecha = (tx.transaction_date || '').slice(0, 10);
      return `
        <div class="bg-slate-900 p-3 rounded-xl text-sm flex justify-between items-center">
          <div>
            <span class="font-mono ${amtColor}">${fmt(tx.amount)}</span>
            <span class="text-slate-400 ml-1">${tx.account_name || tx.account_id}</span>
            <div class="text-xs text-slate-500">
              ${tx.category_icon || ''} ${tx.category_name || '—'} · ${fecha}
            </div>
            ${tx.description ? `<div class="text-xs text-slate-400 mt-0.5 italic">${tx.description}</div>` : ''}
          </div>
          <span class="${badgeCls}">${tx.status}</span>
        </div>`;
    }).join('');
  }

  function renderCuentas() {
    const el = document.getElementById('listaCuentas');
    el.innerHTML = window.NixState.accounts.map(a => `
      <div class="flex justify-between items-center bg-slate-900 p-2 rounded-xl">
        <span>${a.type === 'CASH' ? '💵' : '🏦'} ${a.name}</span>
        <span class="font-mono">${fmt(a.current_balance)} ${a.currency}</span>
      </div>`).join('');
  }

  function populateSelects() {
    const cuentaSel = document.getElementById('cuentaGasto');
    const catSel    = document.getElementById('categoriaGasto');

    cuentaSel.innerHTML = window.NixState.accounts.map(
      a => `<option value="${a.id}">${a.name} (${a.type})</option>`
    ).join('');

    catSel.innerHTML = '<option value="">Sin categoría</option>' +
      window.NixState.categories.map(
        c => `<option value="${c.id}">${c.icon || ''} ${c.name}</option>`
      ).join('');
  }

  // ── Carga inicial desde API ─────────────────────────
  async function init() {
    try {
      const [accRes, catRes, txRes] = await Promise.all([
        apiFetch('/api/accounts'),
        apiFetch('/api/categories'),
        apiFetch('/api/transactions?limit=50'),
      ]);
      window.NixState.accounts     = accRes.accounts     || [];
      window.NixState.categories   = catRes.categories   || [];
      window.NixState.transactions = txRes.transactions  || [];

      document.getElementById('statusConexion').textContent = 'D1 conectado ✓';
      populateSelects();
      refreshSaldos();
      renderTransacciones();
      renderCuentas();
    } catch (err) {
      document.getElementById('statusConexion').textContent = '⚠️ Sin conexión al worker';
      console.error('init error:', err);
    }
  }

  // ── Modal gasto rápido ──────────────────────────────
  const modal = document.getElementById('modalGasto');
  document.getElementById('abrirModalGasto').addEventListener('click', () => modal.style.display = 'flex');
  document.getElementById('cerrarModal').addEventListener('click', () => cerrarModal());
  window.addEventListener('click', e => { if (e.target === modal) cerrarModal(); });

  function cerrarModal() {
    modal.style.display = 'none';
    latCapturado = null; lngCapturado = null;
    document.getElementById('ubicacionStatus').textContent = '📍 Sin ubicación';
    document.getElementById('fileStatus').textContent      = '';
    document.getElementById('errorGasto').classList.add('hidden');
    document.getElementById('archivoGasto').value = '';
    document.getElementById('montoGasto').value   = '';
    document.getElementById('notaGasto').value    = '';
  }

  // Geolocalización
  let latCapturado = null, lngCapturado = null;
  document.getElementById('capturarUbicacion').addEventListener('click', () => {
    if (!navigator.geolocation) {
      document.getElementById('ubicacionStatus').textContent = '❌ No soportado';
      return;
    }
    navigator.geolocation.getCurrentPosition(
      pos => {
        latCapturado = pos.coords.latitude;
        lngCapturado = pos.coords.longitude;
        document.getElementById('ubicacionStatus').textContent =
          `📍 ${latCapturado.toFixed(4)}, ${lngCapturado.toFixed(4)}`;
      },
      () => { document.getElementById('ubicacionStatus').textContent = '❌ Error al obtener ubicación'; }
    );
  });

  // Archivo adjunto
  document.getElementById('archivoGasto').addEventListener('change', e => {
    document.getElementById('fileStatus').textContent =
      e.target.files[0] ? `📎 ${e.target.files[0].name}` : '';
  });

  // Guardar gasto → POST /api/transactions (multipart/form-data)
  document.getElementById('guardarGastoBtn').addEventListener('click', async () => {
    const btn      = document.getElementById('guardarGastoBtn');
    const btnText  = document.getElementById('guardarBtnText');
    const errEl    = document.getElementById('errorGasto');
    const monto    = parseFloat(document.getElementById('montoGasto').value);
    const account_id  = document.getElementById('cuentaGasto').value;
    const category_id = document.getElementById('categoriaGasto').value;
    const nota        = document.getElementById('notaGasto').value.trim();
    const fileInput   = document.getElementById('archivoGasto');

    if (!account_id)       { showErr('Selecciona una cuenta');          return; }
    if (isNaN(monto))      { showErr('Ingresa un monto válido');        return; }

    function showErr(msg) {
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }
    errEl.classList.add('hidden');

    const fd = new FormData();
    fd.append('account_id',  account_id);
    fd.append('category_id', category_id);
    fd.append('amount',      monto);
    if (latCapturado != null) fd.append('lat', latCapturado);
    if (lngCapturado != null) fd.append('lng', lngCapturado);
    if (nota)                  fd.append('nota', nota);
    if (fileInput.files[0])    fd.append('file', fileInput.files[0]);

    btn.disabled   = true;
    btnText.textContent = 'Guardando…';

    try {
      const res = await apiFetch('/api/transactions', { method: 'POST', body: fd });
      window.NixState.transactions.unshift(res.transaction);
      // Actualizar saldo en cuenta (optimista)
      const acc = window.NixState.accounts.find(a => a.id === account_id);
      if (acc) acc.current_balance = parseFloat(acc.current_balance || 0) + monto;

      refreshSaldos();
      renderTransacciones();
      renderCuentas();
      cerrarModal();
      showToast('✅ Transacción guardada');
    } catch (err) {
      showErr(err.message);
    } finally {
      btn.disabled = false;
      btnText.textContent = 'Guardar';
    }
  });

  // ── Importar BBVA → POST /api/import/bbva ──────────
  document.getElementById('ejecutarParser').addEventListener('click', async () => {
    const csvText = document.getElementById('bbvaCsvInput').value.trim();
    const resultEl = document.getElementById('parserResult');
    const btn = document.getElementById('ejecutarParser');

    if (!csvText) { resultEl.textContent = '⚠️ Pega el texto del extracto'; return; }

    btn.disabled = true;
    resultEl.textContent = 'Importando…';

    try {
      const res = await apiFetch('/api/import/bbva', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ csvText }),
      });
      resultEl.textContent = `✅ ${res.imported} transacciones importadas como PENDING`;

      // Recargar transacciones
      const txRes = await apiFetch('/api/transactions?limit=50');
      window.NixState.transactions = txRes.transactions || [];
      renderTransacciones();
    } catch (err) {
      resultEl.textContent = '❌ ' + err.message;
      resultEl.className   = 'text-xs text-red-400 mt-2';
    } finally {
      btn.disabled = false;
    }
  });

  // ── Arrancar ────────────────────────────────────────
  showPanel('dashboard');
  init();
})();
</script>
</body>
</html>
